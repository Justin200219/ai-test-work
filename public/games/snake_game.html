<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake Game</title>
    <link rel="stylesheet" href="../src/snake_game.css" />
  </head>
  <body>
    <!-- Top Header Matching App Design -->
    <div class="top-header">
      <div class="categorie/img"></div>
      <h1>Snake</h1>
      <button
        onclick="window.location.href='/public/Language_settings.html'"
        class="lang-button"
      >
        <img
          class="flag"
          src="../public/images/110-united kingdom.svg"
          alt="English"
        />
        English
      </button>
    </div>

    <!-- Back Button -->
    <a href="../public/choose_game.html" class="back-button">← Back</a>


    <!-- Snake Task and Game UI -->
    <div class="task-box-container">
      <img src="../public/images/ChatGPT Image Apr 23, 2025, 12_12_41 PM 1 (1).svg" alt="Snake" class="snake-icon" />
      <div class="speech-bubble">
        What is the Dutch word for <strong>Bike</strong>?
      </div>
    </div>

    <!-- Letter Progress Container -->
    <div class="letters-progress-container">
      <span class="progress-label">Current letters:</span>
      <div class="letters-progress" id="letterProgress">
        <!-- Letters will fill here -->
      </div>
    </div>

    <!-- Score Bar Container -->
    <div class="score-bar-container">
      <div class="score-box">
        <span>Points:</span> <span id="points">0</span>
      </div>
      <button id="restartBtn">Restart</button>
    </div>

    <div class="game-board" id="gameBoard"></div>

    <!-- Bottom Navigation -->
    <nav>
        <div class="nav_container">
            <a href="/public/words_pages/Words_home.html">
                <div class="nav-words-outer">
                    <div class="nav-words-1">
                        <img src="../public/images/Group 80.svg" alt="Words Icon">
                    </div>
                    <p>Words</p>
                </div>
            </a>
            <a href="pronunciation.html">
            <div class="nav-words-outer">
                <div class="nav-words-2">
                    <img src="../public/images/_x35_6.svg" alt="Pronunciation Icon">
                </div>
                <p>Pronunciation</p>
            </div>
            </a>
            <a href="/public/Sentences_pages/Sentences.html">
            <div class="nav-words-outer">
                <div class="nav-words-3">
                    <img src="../public/images/Group 83.svg" alt="Sentences Icon">
                </div>
                <p>Sentences</p>
            </div>
            </a>
            <div class="nav-words-outer-4">
                <div class="nav-words-4">
                    <img src="../public/images/Group 79.svg" alt="Games Icon">
                </div>
                <p>Games</p>
            </div>

        </div>
    </nav>


    <script src="../src/snake.js"></script>
  </body>
</html>
