<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="AI-powered language learning application" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/icons/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/logo192.png" />
    <link rel="stylesheet" href="../css/pronoun-word.css" />
    <title>AI Language App</title>
</head>
<body>
  <div class="container">
    <!-- NEW TOP HEADER -->
    <div class="top-header">
      <h1>Pronunciation</h1>
      <button class="lang-button">
        <img class="flag" src="../images/110-united kingdom.svg" alt="English" />
        English
      </button>
    </div>

    <!-- GREY DIVIDER -->
    <hr class="divider" />

    <!-- SUB‐HEADER WITH BACK + PROGRESS -->
    <div class="sub-header">
      <button class="back-button">
        <img src="../images/Group 299.svg" alt="Back" />
        Back
      </button>
      <div class="progress">
        <div class="progress-bar"></div>
      </div>
    </div>

    <!-- Main Content -->
    <main class="content">
      <h2>Pronounce the word</h2>
      <div class="image-container">
        <img src="../images/ChatGPT Image Apr 23, 2025, 11_32_37 AM (1).svg" alt="Orange" />
      </div>
      <div class="word">
        Appel <span class="translation">(Apple)</span>
      </div>
      <div class="phonetic">ap·pel</div>
    </main>

    <!-- Footer Buttons -->
    <div class="footer">
      <button class="btn listen-btn" id="listenBtn">
        <img src="../images/brand_awareness.svg" alt="" />Listen
      </button>
      <audio id="audioPlayer" src="../public\word-sounds\Appel.m4a"></audio>
      <script>
        document.getElementById('listenBtn').addEventListener('click', function () {
          const audio = document.getElementById('audioPlayer');
          audio.currentTime = 0; // rewind to start
          audio.play();
        });
      </script>
      <a href="pronoun-word3.html" class="btn next-btn">Next</a>
    </div>

  </div>
</body>
</html>
