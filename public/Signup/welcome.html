<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="AI-powered language learning application" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="shortcut icon" href="/icons/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/logo192.png" />
    <link rel="stylesheet" href="/src/App.css" />
    <link rel="stylesheet" href="/src/welcome.css" />
    <link rel="stylesheet" href="/src/navigation.css" />
    <title>AI Language App</title>
</head>
<body>
    <div class="top-header">
        <div class="categorie/img"></div>
        <h1>Welcome</h1>
        <img src="/images/Pronunciation_Icon.svg" alt="Pronunciation Icon" class="Top-icon">

        <button onclick="window.location.href='/public/Language_settings.html'" class="lang-button">
            <img class="flag" src="/images/english flag.svg" alt="English" />
            English
        </button>
    </div>

    <nav>
        <div class="nav_container">
            <a href="/public/words_pages/Words_home.html">
                <div class="nav-words-outer">
                    <div class="nav-words-1">
                        <img src="/images/Frame 32.svg" alt="Words Icon">
                    </div>
                    <p>Words</p>
                </div>
            </a>
            <a href="pronunciation.html">
                <div class="nav-words-outer-2">
                    <div class="nav-words-2">
                        <img src="/images/Frame 33.svg" alt="Pronunciation Icon">
                    </div>
                    <p>Pronunciation</p>
                </div>
            </a>
            <a href="/public/Sentences_pages/Sentences.html">
                <div class="nav-words-outer">
                    <div class="nav-words-3">
                        <img src="/images/Frame 34.svg" alt="Sentences Icon">
                    </div>
                    <p>Sentences</p>
                </div>
            </a>
            <a href="/public/Games/games.html">
                <div class="nav-words-outer">
                    <div class="nav-words-4">
                        <img src="/images/Frame 35.svg" alt="Games Icon">
                    </div>
                    <p>Games</p>
                </div>
            </a>
            <a href="/public/AI/chat.html">
                <div class="nav-words-outer">
                    <div class="nav-words-5">
                        <img src="/images/ai-chat-icon.svg" alt="AI Chat Icon">
                    </div>
                    <p>AI Chat</p>
                </div>
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="content">
            <img src="/images/cow.svg" alt="Klets Cow" class="cow" />
            <h1>Welcome <span id="userName"></span>!</h1>
            <p>I am your personal Dutch teacher! In this app you can learn words, sentences, pronunciation and play fun games!</p>
            <button class="next-button" onclick="window.location.href='/public/words_pages/Words_home.html'">Start Learning</button>
        </div>
    </div>

    <script>
        // Get the user's name from localStorage and display it
        const userName = localStorage.getItem('userName');
        if (userName) {
            document.getElementById('userName').textContent = userName;
        } else {
            // If no name is found, redirect back to name input
            window.location.href = 'name_input.html';
        }
    </script>
</body>
</html>
