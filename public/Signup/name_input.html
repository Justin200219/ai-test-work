<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="AI-powered language learning application" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/icons/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/logo192.png" />
    <link rel="stylesheet" href="/src/App.css" />
    <link rel="stylesheet" href="/src/name_input.css" />
    <link href="https://fonts.googleapis.com/css?family=Baloo&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Inter&display=swap" rel="stylesheet">

<body>
  <div class="container">
    <div class="content">
      <img src="/public/images/cow.svg" alt="Klets Cow" class="cow" />

      <form class="name-form">

    <button class="next-button">Next</button>

  <script>
    window.addEventListener('load', () => {
      document.body.classList.add('loaded');
    });
  </script>

</html>
