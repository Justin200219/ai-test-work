<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="AI-powered language learning application" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/icons/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/logo192.png" />
    <link rel="stylesheet" href="/css/choose_language.css" />
    <title>AI Language App</title>
</head>
<body>
  <div class="container">
    <div class="content">
      <img src="/ai-language/images/cow.svg" alt="Klets Cow" class="cow" />
      <h1>What language do you speak?</h1>

      <div class="language-list">
        <button class="language-item">
          <img src="/ai-language/images/204-saudi arabia.svg" alt="" class="language-icon" />
          <div class="language-text">
            <span class="language-label">Arabic</span>
            <span class="language-sub">العربية</span>
          </div>
        </button>

        <button class="language-item">
          <img src="/ai-language/images/213-romania.svg" alt="" class="language-icon" />
          <div class="language-text">
            <span class="language-label">Turkish</span>
          </div>
        </button>

        <button class="language-item">
          <img src="icon-kurdish.svg" alt="" class="language-icon" />
          <div class="language-text">
            <span class="language-label">Kurdish</span>
            <span class="language-sub">کوردی</span>
          </div>
        </button>

        <button class="language-item">
          <img src="icon-kurdish2.svg" alt="" class="language-icon" />
          <div class="language-text">
            <span class="language-label">Kurdish</span>
            <span class="language-sub">سۆرانی</span>
          </div>
        </button>

        <button class="language-item">
          <img src="/ai-language/images/051-eritrea.svg" alt="" class="language-icon" />
          <div class="language-text">
            <span class="language-label">Tigrinia</span>
          </div>
        </button>

        <button class="language-item">
          <img src="/ai-language/images/063-somalia.svg" alt="" class="language-icon" />
          <div class="language-text">
            <span class="language-label">Somalian</span>
          </div>
        </button>

        <button class="language-item">
          <img src="/ai-language/images/230-spain.svg" alt="" class="language-icon" />
          <div class="language-text">
            <span class="language-label">Spanish</span>
          </div>
        </button>

        <button class="language-item">
          <img src="/ai-language/images/232-pakistan.svg" alt="" class="language-icon" />
          <div class="language-text">
            <span class="language-label">Urdu</span>
          </div>
        </button>

        <button class="language-item">
          <img src="/ai-language/images/200-iran.svg" alt="" class="language-icon" />
          <div class="language-text">
            <span class="language-label">Farsi</span>
          </div>
        </button>

        <button class="language-item">
          <img src="/ai-language/images/134-bangladesh.svg" alt="" class="language-icon" />
          <div class="language-text">
            <span class="language-label">Bengali</span>
          </div>
        </button>

        <button class="language-item">
          <img src="/ai-language/images/Group 179.svg" alt="" class="language-icon" />
          <div class="language-text">
            <span class="language-label">Chinese</span>
          </div>
        </button>

        <button class="language-item">
          <img src="/ai-language/images/262-ethiopia.svg" alt="" class="language-icon" />
          <div class="language-text">
            <span class="language-label">Amharic</span>
          </div>
        </button>

        <button class="language-item">
          <img src="/ai-language/images/Group 180.svg" alt="" class="language-icon" />
          <div class="language-text">
            <span class="language-label">Russian</span>
          </div>
        </button>

        <button class="language-item">
          <img src="/ai-language/images/198-ukraine.svg" alt="" class="language-icon" />
          <div class="language-text">
            <span class="language-label">Ukrainian</span>
          </div>
        </button>

        <button class="language-item">
          <img src="/ai-language/images/055-india.svg" alt="" class="language-icon" />
          <div class="language-text">
            <span class="language-label">Punjabi (India)</span>
          </div>
        </button>

        <button class="language-item">
          <img src="/ai-language/images/232-pakistan.svg" alt="" class="language-icon" />
          <div class="language-text">
            <span class="language-label">Punjabi</span>
            <span class="language-sub">پنجابی</span>
          </div>
        </button>

        <button class="language-item">
          <img src="/ai-language/images/110-united kingdom.svg" alt="" class="language-icon" />
          <div class="language-text">
            <span class="language-label">English</span>
          </div>
        </button>
      </div>

    <button class="next-button">Next</button>
  </div>
</body>
</html>
