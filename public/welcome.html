<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <link rel="stylesheet" href="/css/welcome.css">
    <link href="https://fonts.googleapis.com/css?family=Baloo&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Inter&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Welcome, <span id="userName"></span>!</h1>
        <p>Let's start your language learning journey</p>
        <button onclick="startLearning()">Start Learning</button>
    </div>

    <script>
        // Check if user has already completed the flow
        if (!localStorage.getItem('hasCompletedFlow')) {
            window.location.href = '../index.html';
        }

        // Display user's name
        document.getElementById('userName').textContent = localStorage.getItem('userName') || 'there';
        
        function startLearning() {
            window.location.href = 'Words.html';
        }
    </script>
</body>
</html>
