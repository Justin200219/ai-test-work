<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Your Name</title>
    <link rel="stylesheet" href="/css/name_input.css">
    <link href="https://fonts.googleapis.com/css?family=Baloo&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Inter&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>What's your name?</h1>
        <form id="nameForm" onsubmit="handleSubmit(event)">
            <input type="text" id="nameInput" placeholder="Enter your name" required>
            <button type="submit">Continue</button>
        </form>
    </div>

    <script>
        // Check if user has already completed the flow
        if (localStorage.getItem('hasCompletedFlow')) {
            window.location.href = 'Words.html';
        }

        function handleSubmit(event) {
            event.preventDefault();
            const name = document.getElementById('nameInput').value;
            localStorage.setItem('userName', name);
            localStorage.setItem('hasCompletedFlow', 'true');
            window.location.href = 'welcome.html';
        }
    </script>
</body>
</html>
